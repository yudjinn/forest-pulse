<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forest Pulse dashboard</title>
    <meta name="theme-color" content="#0B4827">
    <link rel="icon" href="/brand/icons/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="/brand/icons/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="apple-touch-icon" href="/brand/icons/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="/dashboard/shell.css">
    <link rel="stylesheet" href="/dashboard/log/log.css">
    <link rel="stylesheet" href="/dashboard/plan/plan.css">
    <link rel="stylesheet" href="/dashboard/activities/activities.css">
    <script type="module" src="/dashboard/shell.js"></script>
    <script type="module" src="/dashboard/log/log.js"></script>
    <script type="module" src="/dashboard/plan/plan.js"></script>
    <script type="module" src="/dashboard/plan/location.js"></script>
    <script type="module" src="/dashboard/activities/activities.js"></script>
  </head>
  <body>
    <main class="panels">
      <section id="plan" class="panel" aria-labelledby="plan-title">
        <h2 id="plan-title">Sensor plan</h2>
        <p class="error plan-error" role="alert" hidden></p>
        <p class="plan-empty" hidden>No sensors yet. Sensors appear here when they first check in.</p>
        <div class="plan-body" hidden>
          <svg class="plan-map" role="group" aria-label="Plan"></svg>
          <ul class="plan-sensors" aria-label="Sensors"></ul>
        </div>
      </section>
      <section id="activities" class="panel" aria-labelledby="activities-title">
        <div class="activities-head">
          <h2 id="activities-title">Activities</h2>
          <button type="button" class="activities-clear" disabled>Clear events</button>
        </div>
        <p class="error" role="alert" hidden></p>
        <ol class="activity-list" aria-labelledby="activities-title"></ol>
        <p class="activities-empty" hidden>Nothing heard yet</p>
        <dialog class="activities-confirm" aria-labelledby="clear-title" aria-describedby="clear-what">
          <h2 id="clear-title">Clear events?</h2>
          <p id="clear-what">Every event and activity will be removed. Sensors and sounds stay.</p>
          <div class="activities-confirm-actions">
            <button type="button" class="secondary" data-action="cancel">Cancel</button>
            <button type="button" class="danger" data-action="clear">Clear events</button>
          </div>
        </dialog>
      </section>
      <section id="log" class="panel" aria-labelledby="log-title">
        <h2 id="log-title">Event log</h2>
        <div class="log-scroll">
          <table>
            <thead>
              <tr><th scope="col">Time</th><th scope="col">Sensor</th><th scope="col">Sound</th><th scope="col">Confidence</th><th scope="col">Angle</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="log-empty" hidden>No events yet</p>
      </section>
    </main>
  </body>
</html>
