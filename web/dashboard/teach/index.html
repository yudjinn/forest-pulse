<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teach a new sound - Forest Pulse dashboard</title>
    <meta name="theme-color" content="#0B4827">
    <link rel="icon" href="/brand/icons/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="/brand/icons/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="apple-touch-icon" href="/brand/icons/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="/dashboard/shell.css">
    <link rel="stylesheet" href="/dashboard/teach/teach.css">
    <script type="module" src="/dashboard/shell.js"></script>
    <script type="module" src="/dashboard/teach/teach.js"></script>
  </head>
  <body>
    <main class="panels">
      <section id="teach" class="panel" aria-labelledby="teach-title">
        <h2 id="teach-title">Teach a new sound</h2>
        <form class="teach-form">
          <label for="teach-name">Name</label>
          <input id="teach-name" name="name" autocomplete="off" maxlength="60" required>
          <label for="teach-category">Category</label>
          <select id="teach-category" name="category">
            <option value="wildlife" selected>Wildlife</option>
            <option value="logging">Logging</option>
            <option value="vehicle">Vehicle</option>
            <option value="poaching">Poaching</option>
          </select>
          <div class="drop" data-testid="drop-zone">
            <label for="teach-files">Recordings</label>
            <input id="teach-files" name="recordings" type="file" multiple
              accept=".wav,.mp3,.flac,.ogg,.m4a,audio/wav,audio/mpeg,audio/flac,audio/ogg,audio/mp4">
          </div>
          <ul class="clip-list"></ul>
          <p class="error" role="alert" hidden></p>
          <div class="teach-actions">
            <a href="/dashboard/sounds/">Cancel</a>
            <button type="submit">Teach</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
