<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sounds - Forest Pulse dashboard</title>
    <meta name="theme-color" content="#0B4827">
    <link rel="icon" href="/brand/icons/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="/brand/icons/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="apple-touch-icon" href="/brand/icons/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="/dashboard/shell.css">
    <link rel="stylesheet" href="/dashboard/sounds/sounds.css">
    <script type="module" src="/dashboard/shell.js"></script>
    <script type="module" src="/dashboard/sounds/sounds.js"></script>
  </head>
  <body>
    <main class="panels">
      <section id="sounds" class="panel" aria-labelledby="sounds-title">
        <div class="sounds-head">
          <h2 id="sounds-title">Sounds</h2>
          <a class="teach-link" href="/dashboard/teach/">Teach a new sound</a>
        </div>
        <ul class="sound-list"></ul>
        <dialog class="sound-confirm" aria-labelledby="delete-title">
          <h2 id="delete-title"></h2>
          <div class="sound-confirm-actions">
            <button type="button" class="secondary" data-action="cancel">Cancel</button>
            <button type="button" class="danger" data-action="delete">Delete</button>
          </div>
        </dialog>
      </section>
    </main>
  </body>
</html>
