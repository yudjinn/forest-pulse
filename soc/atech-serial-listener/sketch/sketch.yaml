profiles:
  default:
    platforms:
      - platform: arduino:zephyr
    libraries:
      # Modulino Thermo (speed of sound) + Buzzer (location calibration).
      # 0.10.0+: newer Thermo boards use an SHT31 at 0x45 (0.7.0 only knew the
      # HS300x at 0x44). Arduino_LED_Matrix and Arduino_RouterBridge ship with the core.
      - Arduino_Modulino (0.10.0)
      - dependency: SHT31 (0.5.3)
      - dependency: ArduinoGraphics (1.1.4)
      - dependency: Arduino_HS300x (1.0.0)
      - dependency: Arduino_LPS22HB (1.0.2)
      - dependency: Arduino_LSM6DSOX (1.1.2)
      - dependency: Arduino_LTR381RGB (1.0.0)
      - dependency: STM32duino VL53L4CD (1.0.5)
      - dependency: STM32duino VL53L4ED (1.0.1)
default_profile: default
