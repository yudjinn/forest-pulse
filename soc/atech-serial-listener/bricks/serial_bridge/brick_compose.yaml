# Helper container that owns the ESP32's serial port.
#
# Why: the App's main Python container is not given /dev/tty* devices, and
# app.yaml has no way to add them. A custom Brick's compose file *can*, so this
# container opens the TTY and serves it as raw TCP on port 5000 inside the
# App's Docker network. main.py connects to serial-bridge:5000.
#
# Hot-plug: /dev is bind-mounted and the USB-serial device classes are
# whitelisted, so the container starts even when the ESP32 isn't plugged in
# yet, waits for it, and comes back after a re-plug (socat exits when the port
# disappears; 'restart: always' starts the wait again).
#
# The ESP32 is found by its USB ID (by-id name "usb-Espressif_*"). Its by-id
# name contains ':' (MAC address), which socat can't parse, so it is linked to
# /tmp/esp32 first.
#
# NO '$' IN THE SCRIPT BELOW: App Lab un-escapes '$$' when it copies the brick
# and then interpolates '$VAR' (to empty) when it merges the compose files, so
# shell variables silently become "". Globs and fixed paths only.

services:
  serial-bridge:
    image: alpine/socat:latest
    restart: always
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - "c 166:* rmw"   # /dev/ttyACM*  (CDC-ACM: the ESP32's native USB)
      - "c 188:* rmw"   # /dev/ttyUSB*  (FTDI, CH340, CP210x)
    expose:
      - "5000"
    entrypoint: ["/bin/sh", "-c"]
    # No 'fork': exactly one client owns the port at a time, so two readers
    # never split the byte stream.
    # noctty,rawer: no line discipline (0x03/0x1C bytes in the audio would
    #   otherwise SIGINT/SIGQUIT socat).
    # hupcl=0: keep DTR=RTS asserted between client connections (DTR=0 with
    #   RTS=1 resets the ESP32). Baud is ignored by the ESP32's USB CDC port.
    # -b 65536: the ESP32 bursts ~768 KB/s at event start.
    command:
      - |
        until ls /dev/serial/by-id/usb-Espressif_* >/dev/null 2>&1; do
          echo "waiting for the ESP32 (no Espressif USB serial device yet)"; sleep 2
        done
        ln -sf /dev/serial/by-id/usb-Espressif_* /tmp/esp32
        echo "serving the ESP32 on :5000"; ls -l /tmp/esp32
        exec socat -d -d -b 65536 TCP-LISTEN:5000,reuseaddr /tmp/esp32,noctty,rawer,echo=0,hupcl=0,b115200
