<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EfficientAT Live</title>
<style>
  :root { --bg:#0f1512; --panel:#18211c; --line:#2a362f; --text:#e6efe9; --dim:#8fa398; --ok:#4fbf7f; --alert:#ff5a4f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px; display:grid; gap:16px; grid-template-columns: 1fr 320px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  h1 { grid-column: 1 / -1; margin:0; font-size:20px; font-weight:600; }
  h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); font-weight:600; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  button, select { background:#22302a; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 12px; font:inherit; cursor:pointer; }
  button.primary { background:var(--ok); color:#06120b; border-color:var(--ok); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  label { color:var(--dim); display:flex; gap:6px; align-items:center; }
  #status { border-radius:10px; padding:22px; text-align:center; font-size:28px; font-weight:700; background:#111a15; border:1px solid var(--line); transition: background .15s; }
  #status.alert { background:var(--alert); color:#fff; border-color:var(--alert); }
  #status small { display:block; font-size:14px; font-weight:500; color:var(--dim); margin-top:4px; }
  #status.alert small { color:#ffe3e0; }
  canvas { width:100%; height:120px; display:block; margin-top:14px; }
  .row { display:grid; grid-template-columns: 1fr 52px; gap:8px; align-items:center; margin:6px 0; }
  .bar { height:22px; background:#111a15; border-radius:4px; position:relative; overflow:hidden; }
  .bar i { position:absolute; inset:0 auto 0 0; background:#3c7a59; }
  .bar span { position:relative; padding:0 8px; line-height:22px; font-size:13px; white-space:nowrap; }
  .num { text-align:right; font-variant-numeric: tabular-nums; color:var(--dim); font-size:13px; }
  .clips { max-height: 560px; overflow:auto; }
  .clip { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .clip.playing { color:var(--ok); }
  .cat { color:var(--dim); }
  .group { margin:12px 0 4px; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
</style>
</head>
<body>
<main>
  <h1>EfficientAT live test</h1>
  <div style="display:grid; gap:16px">
    <section>
      <div class="controls">
        <button id="start" class="primary">Start listening</button>
        <label>Model <select id="model"></select></label>
        <label>Threshold <input id="thresh" type="range" min="0.05" max="0.8" step="0.05" value="0.2"><span id="threshv">0.20</span></label>
      </div>
      <div id="status">Not listening<small>&nbsp;</small></div>
      <canvas id="chart" width="1200" height="240"></canvas>
    </section>
    <section>
      <h2>Heard now</h2>
      <div id="top"></div>
    </section>
  </div>
  <section class="clips">
    <h2>Test clips</h2>
    <div class="controls"><button id="stop" disabled>Stop clip</button></div>
    <div id="clips"></div>
  </section>
</main>
<audio id="player"></audio>
<script>
const $ = (id) => document.getElementById(id);
const player = $("player");
let sock = null, history = [];

const thresh = () => parseFloat($("thresh").value);
$("thresh").oninput = () => { $("threshv").textContent = thresh().toFixed(2); draw(); };

fetch("/api/clips").then(r => r.json()).then(({ clips, models }) => {
  $("model").innerHTML = models.map(m => `<option>${m}</option>`).join("");
  const groups = { chainsaw: clips.filter(c => c.category === "chainsaw"), other: clips.filter(c => c.category !== "chainsaw") };
  $("clips").innerHTML = Object.entries(groups).map(([g, list]) =>
    `<div class="group">${g === "chainsaw" ? "Chainsaw" : "Not chainsaw"}</div>` +
    list.map(c => `<div class="clip" data-url="${c.url}"><span>${c.name}<br><span class="cat">${c.category.replace("_", " ")}</span></span><button>Play</button></div>`).join("")
  ).join("");
  document.querySelectorAll(".clip button").forEach(b => b.onclick = () => {
    const row = b.closest(".clip");
    document.querySelectorAll(".clip").forEach(r => r.classList.remove("playing"));
    row.classList.add("playing");
    player.src = row.dataset.url; player.play(); $("stop").disabled = false;
  });
});
$("stop").onclick = () => { player.pause(); player.currentTime = 0; };
player.onpause = player.onended = () => { $("stop").disabled = true; document.querySelectorAll(".clip").forEach(r => r.classList.remove("playing")); };
$("model").onchange = () => sock?.readyState === 1 && sock.send(JSON.stringify({ model: $("model").value }));

const WORKLET = `
class Tap extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Float32Array(4000); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) for (let i = 0; i < ch.length; i++) {
      this.buf[this.n++] = ch[i];
      if (this.n === this.buf.length) { this.port.postMessage(this.buf.slice()); this.n = 0; }
    }
    return true;
  }
}
registerProcessor("tap", Tap);`;

$("start").onclick = async () => {
  $("start").disabled = true;
  try {
    // Echo cancellation would subtract the clip this page plays from the mic signal, so it is off.
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
    const ctx = new AudioContext({ sampleRate: 32000 });
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
    const tap = new AudioWorkletNode(ctx, "tap");
    ctx.createMediaStreamSource(stream).connect(tap);
    sock = new WebSocket(`ws://${location.host}/ws`);
    sock.binaryType = "arraybuffer";
    sock.onopen = () => sock.send(JSON.stringify({ model: $("model").value }));
    sock.onmessage = (e) => render(JSON.parse(e.data));
    sock.onclose = () => { $("status").className = ""; $("status").innerHTML = "Disconnected<small>&nbsp;</small>"; $("start").disabled = false; };
    tap.port.onmessage = (e) => sock.readyState === 1 && sock.send(e.data.buffer);
    $("start").textContent = "Listening";
  } catch (err) {
    $("status").innerHTML = `Microphone unavailable<small>${err.message}</small>`;
    $("start").disabled = false;
  }
};

function render(r) {
  history.push(r); if (history.length > 120) history.shift();
  const hit = r.chainsaw >= thresh();
  $("status").className = hit ? "alert" : "";
  $("status").innerHTML = hit
    ? `CHAINSAW DETECTED<small>score ${r.chainsaw.toFixed(2)} · ${r.model}</small>`
    : `Listening<small>chainsaw ${r.chainsaw.toFixed(2)} · machinery ${r.machinery.toFixed(2)} · ${r.model}</small>`;
  $("top").innerHTML = r.top.map(([name, p]) =>
    `<div class="row"><div class="bar"><i style="width:${(p * 100).toFixed(1)}%;${name === "Chainsaw" ? "background:var(--alert)" : ""}"></i><span>${name}</span></div><div class="num">${p.toFixed(2)}</div></div>`).join("");
  draw();
}

function draw() {
  const c = $("chart"), g = c.getContext("2d"), W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  const y = (v) => H - 8 - v * (H - 16);
  g.strokeStyle = "#2a362f"; g.setLineDash([8, 8]); g.lineWidth = 2;
  g.beginPath(); g.moveTo(0, y(thresh())); g.lineTo(W, y(thresh())); g.stroke(); g.setLineDash([]);
  const line = (key, color) => {
    g.strokeStyle = color; g.lineWidth = 4; g.beginPath();
    history.forEach((r, i) => { const x = W - (history.length - 1 - i) * (W / 119); i ? g.lineTo(x, y(r[key])) : g.moveTo(x, y(r[key])); });
    g.stroke();
  };
  line("machinery", "#5c7a6a");
  line("chainsaw", "#ff5a4f");
}
</script>
</body>
</html>
