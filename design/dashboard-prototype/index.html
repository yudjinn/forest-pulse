<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest Pulse</title>
<style>
:root {
  color-scheme: dark;
  --evergreen: #0b4827;
  --ivory: #fbf7ef;
  --night: #06301a;
  --deep: #03190d;
  --panel: #062b18;
  --ember: #ff6a3c;
  --amber: #f6b93b;
  --rose: #f0457c;
  --moon: #8fe3d0;
  --soft: rgba(251, 247, 239, 0.7);
  --faint: rgba(251, 247, 239, 0.44);
  --hair: rgba(251, 247, 239, 0.16);
  font-family: "Avenir Next", Avenir, "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.35;
  color: var(--ivory);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(120% 95% at 50% 46%, #0b4428 0%, var(--night) 46%, var(--deep) 100%);
  font-variant-numeric: tabular-nums;
}
.c-logging { --c: var(--ember); }
.c-vehicle { --c: var(--amber); }
.c-poaching { --c: var(--rose); }
.c-wildlife { --c: var(--moon); }
h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ivory); outline-offset: 2px; }
[hidden] { display: none !important; }
svg.ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* The map */
.stage { position: fixed; inset: 0; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stage canvas.moving { cursor: grabbing; }
.stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  box-shadow: inset 0 0 22vmin 4vmin rgba(255, 106, 60, 0.34);
  transition: opacity 0.6s;
}
.alarm .stage::after { opacity: 1; animation: breathe 2.2s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.45; } }
#tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px;
  padding: 7px 14px 7px 9px; border-radius: 999px; background: var(--c); color: #04200f;
  font-weight: 600; font-size: 17px; white-space: nowrap; will-change: transform;
  box-shadow: 0 0 28px color-mix(in srgb, var(--c) 55%, transparent);
}
.tag svg.ico { width: 22px; height: 22px; stroke-width: 2; }
.tag span { font-weight: 500; }

/* Top bar */
.top { position: fixed; inset: 0 0 auto 0; display: flex; align-items: center; justify-content: space-between; padding: 22px 32px; pointer-events: none; }
.top > * { pointer-events: auto; }
.logo svg { display: block; height: 38px; width: auto; }
.tools { display: flex; gap: 10px; }
.icon-btn {
  position: relative; display: grid; place-items: center; width: 42px; height: 42px; padding: 0;
  border: 1px solid var(--hair); border-radius: 50%; background: rgba(4, 32, 17, 0.6); color: var(--soft);
}
.icon-btn:hover, .icon-btn[aria-expanded="true"] { color: var(--ivory); border-color: var(--faint); background: var(--panel); }
.icon-btn.on::after { content: ""; position: absolute; top: 1px; right: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--ivory); animation: breathe 1.2s infinite; }

/* What was heard */
.heard { position: fixed; left: 0; top: 76px; width: 374px; padding: 24px 32px; max-height: calc(100vh - 170px); overflow: auto; scrollbar-width: none; }
.status { display: flex; align-items: center; gap: 10px; color: var(--soft); font-size: 15px; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: #5fd28d; box-shadow: 0 0 0 0 rgba(95, 210, 141, 0.6); animation: ping 3s infinite; }
.status.short i { background: var(--amber); animation: none; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(95, 210, 141, 0.55); } 40%, 100% { box-shadow: 0 0 0 9px rgba(95, 210, 141, 0); } }
#feed-empty { margin-top: 10px; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
#feed { margin-top: 22px; display: grid; gap: 18px; }
.act { display: grid; grid-template-columns: auto 1fr; gap: 0 14px; align-items: start; }
.act .badge { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: var(--c); border: 1.5px solid color-mix(in srgb, var(--c) 55%, transparent); }
.act .badge svg.ico { width: 19px; height: 19px; }
.act h3 { font-size: 17px; font-weight: 600; line-height: 34px; }
.act p { grid-column: 2; font-size: 14px; color: var(--soft); }
.act.live .badge { width: 48px; height: 48px; background: var(--c); border: 0; color: #04200f; box-shadow: 0 0 30px color-mix(in srgb, var(--c) 50%, transparent); }
.act.live .badge svg.ico { width: 27px; height: 27px; stroke-width: 2; }
.act.live h3 { font-size: 30px; letter-spacing: -0.02em; line-height: 48px; }
.act.live p { font-size: 16px; }
.act.live p.where { color: var(--ivory); font-weight: 500; }
.act .acts { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 12px; }
.btn { padding: 10px 20px; border: 1px solid var(--faint); border-radius: 999px; background: transparent; font-weight: 600; font-size: 15px; }
.btn:hover { border-color: var(--ivory); }
.btn.warn { border: 0; background: var(--ember); color: #04200f; padding: 12px 24px; font-size: 16px; }
.btn.warn:hover { background: #ff825a; }
.btn.fill { border: 0; background: var(--ivory); color: var(--evergreen); }
.btn:disabled { opacity: 0.45; cursor: default; }
.link { padding: 4px 0; border: 0; background: none; color: var(--soft); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--ivory); }
.link.danger { color: #ff9b7b; }

/* What the sensors listen for */
.listen { position: fixed; right: 0; top: 76px; width: 328px; padding: 24px 32px; max-height: calc(100vh - 170px); overflow: auto; scrollbar-width: none; }
.listen h2 { font-size: 15px; font-weight: 500; color: var(--soft); margin-bottom: 8px; }
.sound { display: flex; align-items: center; gap: 12px; padding: 7px 10px; margin: 0 -10px; border-radius: 10px; font-size: 16px; font-weight: 500; }
.sound svg.ico { width: 20px; height: 20px; color: var(--c); }
.sound .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sound.off .name { color: var(--faint); }
.sound.off svg.ico { color: var(--faint); }
.sound .del { border: 0; background: none; padding: 2px; color: var(--faint); display: grid; opacity: 0; }
.sound:hover .del, .sound .del:focus-visible { opacity: 1; }
.sound .del:hover { color: var(--ivory); }
.sound .del svg.ico { width: 16px; height: 16px; }
.sw { appearance: none; flex: none; margin: 0; width: 36px; height: 21px; border-radius: 11px; background: rgba(251, 247, 239, 0.18); position: relative; cursor: pointer; transition: background 0.15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: var(--ivory); transition: transform 0.15s; }
.sw:checked { background: #2f9a5e; }
.sw:checked::after { transform: translateX(15px); }
#btn-teach { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 9px 18px 9px 12px; }
#btn-teach svg.ico { width: 18px; height: 18px; }
#reach { margin-top: 12px; font-size: 14px; color: var(--soft); }

/* The pulse: every sensor check-in is a beat, every sound a spike */
.pulse { position: fixed; inset: auto 0 0 0; height: 78px; padding: 0; border: 0; background: none; display: block; width: 100%;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%); mask-image: linear-gradient(90deg, transparent, #000 22%); }
.pulse canvas { display: block; width: 100%; height: 100%; }

/* Panels that open over the map */
.popover, .drawer, dialog { background: var(--panel); border: 1px solid var(--hair); color: var(--ivory); box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5); }
.popover { position: fixed; top: 76px; right: 84px; width: 300px; padding: 8px; border-radius: 16px; }
.sample { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 10px; border: 0; border-radius: 10px; background: none; text-align: left; }
.sample:hover { background: rgba(251, 247, 239, 0.07); }
.sample .pp { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--faint); flex: none; }
.sample .pp svg { width: 12px; height: 12px; fill: currentColor; }
.sample.playing .pp { background: var(--ivory); color: var(--evergreen); border-color: var(--ivory); }
.sample b { display: block; font-weight: 600; font-size: 15px; }
.sample small { display: block; font-size: 12px; color: var(--faint); }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100vw); display: flex; flex-direction: column; border-width: 0 0 0 1px; border-radius: 22px 0 0 22px; }
.drawer-head { display: flex; align-items: center; gap: 4px; padding: 20px 20px 0 24px; }
.tab { padding: 8px 12px; border: 0; border-bottom: 2px solid transparent; background: none; font-size: 17px; font-weight: 600; color: var(--faint); }
.tab[aria-selected="true"] { color: var(--ivory); border-bottom-color: var(--ivory); }
.drawer-head .icon-btn { margin-left: auto; border: 0; background: none; }
.drawer-body { flex: 1; overflow: auto; padding: 18px 24px 24px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cal { padding-bottom: 18px; border-bottom: 1px solid var(--hair); }
.cal p { font-size: 14px; color: var(--soft); }
.device { padding: 18px 0; border-bottom: 1px solid var(--hair); }
.device h3 { font-size: 18px; font-weight: 600; }
.device .state { font-size: 14px; font-weight: 600; color: #5fd28d; }
.device .state.warn { color: var(--amber); }
.device dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 16px; margin: 10px 0 12px; font-size: 13px; }
.device dt { color: var(--faint); }
.device dd { margin: 0; color: var(--soft); overflow-wrap: anywhere; }
.device label, .tune label { font-size: 14px; font-weight: 600; }
.device input { width: 68px; padding: 6px 8px; border: 1px solid var(--hair); border-radius: 8px; background: rgba(0, 0, 0, 0.25); }
.tune { padding: 18px 0; border-bottom: 1px solid var(--hair); }
.tune input[type="range"] { width: 100%; margin-top: 10px; accent-color: var(--ivory); }
.drawer-foot { padding-top: 18px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--faint); padding: 0 8px 8px 0; }
td { padding: 6px 8px 6px 0; border-top: 1px solid var(--hair); color: var(--soft); }
td:nth-child(3) { color: var(--ivory); }

dialog { width: min(460px, calc(100vw - 32px)); padding: 28px; border-radius: 22px; }
dialog::backdrop { background: rgba(2, 16, 9, 0.62); backdrop-filter: blur(3px); }
dialog h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 18px; }
dialog form { display: grid; gap: 16px; }
dialog label.field { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
dialog input[type="text"] { padding: 11px 12px; border: 1px solid var(--hair); border-radius: 8px; background: rgba(0, 0, 0, 0.25); font-size: 16px; }
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cats label { display: grid; justify-items: center; gap: 4px; padding: 10px 4px; border: 1px solid var(--hair); border-radius: 12px; font-size: 13px; font-weight: 600; color: var(--soft); cursor: pointer; }
.cats input { position: absolute; opacity: 0; }
.cats label:has(:checked) { border-color: var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); }
.cats label:has(:focus-visible) { outline: 2px solid var(--ivory); outline-offset: 2px; }
.drop { display: grid; place-items: center; gap: 4px; min-height: 108px; padding: 16px; border: 1.5px dashed var(--faint); border-radius: 14px; background: none; font-size: 16px; font-weight: 600; text-align: center; }
.drop small { font-size: 13px; font-weight: 400; color: var(--faint); }
.drop.over, .drop:hover { border-color: var(--ivory); background: rgba(251, 247, 239, 0.05); }
.progress { height: 4px; border-radius: 2px; background: var(--hair); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--ivory); transition: width 0.2s linear; }
#teach-state { font-size: 14px; color: var(--soft); }
#teach-state:empty { display: none; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }

@media (max-width: 900px) {
  body { overflow: auto; }
  .stage { position: relative; inset: auto; height: 54svh; }
  .top { padding: 14px 16px; }
  .logo svg { height: 30px; }
  .heard, .listen { position: static; width: auto; max-height: none; padding: 8px 16px 20px; overflow: visible; }
  .pulse { position: static; }
  .popover { right: 16px; top: 64px; }
  .drawer { border-radius: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .alarm .stage::after, .status i, .icon-btn.on::after { animation: none; }
}
</style>
</head>

  <div class="tools">

<section class="heard" aria-label="Heard">
  <p class="status"><i></i><span id="status-text"></span></p>
  <p id="feed-empty">Nothing heard yet</p>
  <ol id="feed"></ol>
</section>

<section class="listen" aria-labelledby="listen-title">
  <h2 id="listen-title">Listening for</h2>
  <ul id="sound-list"></ul>
  <button id="btn-teach" class="btn"><svg class="ico"><use href="#i-plus"/></svg>Teach a new sound</button>
  <p id="reach" hidden></p>
</section>

<button class="pulse" id="btn-pulse" aria-label="Open event log" title="Open event log"><canvas id="pulse"></canvas></button>

<div id="player" class="popover" hidden></div>

<aside id="drawer" class="drawer" aria-label="Devices" hidden>
  <div class="drawer-head" role="tablist">
    <button class="tab" role="tab" data-tab="devices" aria-selected="true">Devices</button>
    <button class="tab" role="tab" data-tab="log" aria-selected="false">Event log</button>
    <button class="icon-btn" id="drawer-close" aria-label="Close"><svg class="ico"><use href="#i-close"/></svg></button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<dialog id="teach" aria-labelledby="teach-title">
  <h2 id="teach-title">Teach a new sound</h2>
  <form method="dialog" id="teach-form">
    <label class="field">Name<input type="text" id="teach-name" maxlength="60" autocomplete="off" required></label>
    <div class="cats" role="radiogroup" aria-label="Category">
      <label class="c-wildlife"><input type="radio" name="cat" value="wildlife" checked><svg class="ico"><use href="#i-wildlife"/></svg>Wildlife</label>
      <label class="c-logging"><input type="radio" name="cat" value="logging"><svg class="ico"><use href="#i-logging"/></svg>Logging</label>
      <label class="c-vehicle"><input type="radio" name="cat" value="vehicle"><svg class="ico"><use href="#i-vehicle"/></svg>Vehicle</label>
      <label class="c-poaching"><input type="radio" name="cat" value="poaching"><svg class="ico"><use href="#i-poaching"/></svg>Poaching</label>
    </div>
    <button type="button" class="drop" id="teach-drop">Drop recordings here<small>or choose files</small></button>
    <div class="progress" id="teach-bar" hidden><i></i></div>
    <p id="teach-state" role="status"></p>
    <div class="dialog-actions">
      <button type="button" class="btn" id="teach-cancel">Cancel</button>
      <button type="submit" class="btn fill" id="teach-go">Teach</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pad = (n) => String(n).padStart(2, "0");
const FONT = '"Avenir Next", Avenir, "Nunito Sans", "Segoe UI", system-ui, sans-serif';
const COLOR = { logging: "#ff6a3c", vehicle: "#f6b93b", poaching: "#f0457c", wildlife: "#8fe3d0" };
const IVORY = "251,247,239";
const SHOW_MS = 12000;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rgba = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;
const wall = (t) => new Date(Date.now() - (performance.now() - t));
const hhmm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const hms = (d) => `${hhmm(d)}:${pad(d.getSeconds())}`;
const names = (ns) => { const a = [...ns].sort(); return "Sensor " + (a.length < 2 ? a.join("") : `${a.slice(0, -1).join(", ")} and ${a.at(-1)}`); };

/* ---------- Stand-in data (the real page reads all of this from the service) ---------- */
const sensors = [
  { n: 1, id: "fp-unoq-3fa2c1", x: -0.55, y: -0.22, facing: 35 },
  { n: 2, id: "fp-unoq-9be407", x: 0.6, y: -0.3, facing: 330 },
  { n: 3, id: "fp-unoq-c41d7a", x: 0.02, y: 0.58, facing: 180 },
].map((s, i) => ({ ...s, tx: s.x, ty: s.y, online: true, sdk: "0.7.0", model: "mn10_as", list: 3, rpm: 3 + i, floor: -52 + i * 2,
  trig: 2.2 + i * 0.3, next: 700 + i * 950, last: -1e9, alarmUntil: 0, heardAt: -1e9, heardCat: "logging" }));
let listVersion = 3;
let sensitivity = 0.5;
const sounds = [
  { id: "chainsaw", name: "Chainsaw", category: "logging" }, { id: "tools", name: "Tools", category: "logging" },
  { id: "power-tool", name: "Power tool", category: "logging" }, { id: "vehicle", name: "Vehicle", category: "vehicle" },
  { id: "engine", name: "Engine", category: "vehicle" }, { id: "aircraft", name: "Aircraft", category: "vehicle" },
  { id: "gunshot", name: "Gunshot", category: "poaching" },
].map((s) => ({ ...s, enabled: true, taught: false }));
// Where the stand-in speaker is for each sample, and which sensors are close enough to hear it.
const samples = [
  { id: "chainsaw-1", name: "Chainsaw 1", sound: "chainsaw", credit: "UncleSigmund, CC BY-NC 3.0", at: [1.5, 1.9], hear: [1, 2, 3] },
  { id: "chainsaw-2", name: "Chainsaw 2", sound: "chainsaw", credit: "Benboncan, CC BY-NC 3.0", at: [-6.4, 5.6], hear: [1, 3] },
  { id: "chainsaw-3", name: "Chainsaw 3", sound: "chainsaw", credit: "fkurz, CC BY-NC 3.0", at: [3.1, -2.0], hear: [2] },
  { id: "boreal-owl-1", name: "Boreal owl 1", sound: "taught", credit: "Johan Lundgren, CC BY-NC-SA 4.0", at: [-2.3, 2.4], hear: [1, 2, 3] },
  { id: "boreal-owl-2", name: "Boreal owl 2", sound: "taught", credit: "Stein Ø. Nilsen, CC BY-NC-SA 4.0", at: [4.4, 3.2], hear: [2, 3] },
  { id: "tawny-owl", name: "Tawny owl", sound: null, credit: "Mark Plummer, CC BY-NC-SA 4.0", at: [0, 3], hear: [] },
];
const events = [];       // { t, n, sound, category, conf, angle }
const beats = [];        // { t } one per sensor check-in
const activities = [];   // newest first
const fixes = new Map(); // category -> a located sound
const bearings = new Map(); // category:n -> a direction from one sensor
const chirps = [];       // calibration sweeps { n, t }
let playing = null, nextHear = 0, calib = null, calibratedAt = null, deviceMode = false, touched = false;

/* ---------- Camera and projection ---------- */
const cv = $("#scene"), g = cv.getContext("2d");
const HOME = { az: -0.42, el: 0.6 };
const camera = { az: HOME.az, el: HOME.el, azT: HOME.az, elT: HOME.el, lr: Math.log(2.2), side: 0 };
let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, slabPx = 0, C = null;

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  if (cv.width !== W * DPR || cv.height !== H * DPR) { cv.width = W * DPR; cv.height = H * DPR; }
  const wide = innerWidth > 900;
  const room = 1 - 0.2 * camera.side;
  slabPx = (wide ? Math.min(W * 0.265, H * 0.5) : Math.min(W * 0.47, H * 0.6)) * room;
  cx = W / 2 - (wide ? 200 * camera.side : 0); cy = H * (wide ? 0.455 : 0.5);
  const pc = $("#pulse"), pw = pc.clientWidth * DPR, ph = pc.clientHeight * DPR;
  if (pc.width !== pw || pc.height !== ph) { pc.width = pw; pc.height = ph; }
}
function setupCam() {
  const range = Math.exp(camera.lr), d = range * 3.4;
  const ce = Math.cos(camera.el), se = Math.sin(camera.el), sa = Math.sin(camera.az), ca = Math.cos(camera.az);
  const f = [-ce * sa, ce * ca, -se], r = [ca, sa, 0];
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  C = { range, pos: [d * ce * sa, -d * ce * ca, d * se], f, r, u, focal: slabPx * 3.4, squash: se, camAngle: Math.atan2(-ca, sa) };
}
/** Plan metres (x right, y up, z height) to screen pixels, with the pixels one metre covers there. */
function P(x, y, z = 0) {
  const vx = x - C.pos[0], vy = y - C.pos[1], vz = z - C.pos[2];
  const k = C.focal / (vx * C.f[0] + vy * C.f[1] + vz * C.f[2]);
  return [cx + (vx * C.r[0] + vy * C.r[1]) * k, cy - (vx * C.u[0] + vy * C.u[1] + vz * C.u[2]) * k, k];
}
function unproject(px, py) {
  const dx = px - cx, dy = cy - py;
  const dir = [0, 1, 2].map((i) => C.f[i] * C.focal + C.r[i] * dx + C.u[i] * dy);
  const t = -C.pos[2] / dir[2];
  return [C.pos[0] + dir[0] * t, C.pos[1] + dir[1] * t];
}
function ringPath(x, y, rad, a0 = 0, a1 = TAU, z = 0) {
  g.beginPath();
  const n = Math.max(12, Math.round(80 * (a1 - a0) / TAU));
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * i / n, p = P(x + rad * Math.cos(a), y + rad * Math.sin(a), z);
    i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]);
  }
}
function glowLine(a, b, color, alpha, width = 1.6) {
  g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]);
  g.strokeStyle = rgba(color, alpha * 0.16); g.lineWidth = width * 5; g.stroke();
  g.strokeStyle = rgba(color, alpha * 0.75); g.lineWidth = width; g.stroke();
}
function label(text, x, y, size = 13, alpha = 0.9) {
  g.font = `600 ${size}px ${FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
  g.lineWidth = 4; g.strokeStyle = "rgba(4,32,17,.9)"; g.strokeText(text, x, y);
  g.fillStyle = `rgba(${IVORY},${alpha})`; g.fillText(text, x, y);
}

/* ---------- The map ---------- */
const trees = Array.from({ length: 46 }, (_, i) => {
  const r = (n) => { const v = Math.sin(i * 127.1 + n * 311.7) * 43758.5453; return v - Math.floor(v); };
  return { a: (i / 46) * TAU + r(1) * 0.1, rr: 0.9 + r(2) * 0.085, h: 0.13 + r(3) * 0.13, tone: r(4) };
});

function drawSlab() {
  const R = C.range, t = R * 0.075, n = 96;
  const under = P(0, 0, -t * 4);
  g.save(); g.translate(under[0], under[1]); g.scale(1, C.squash);
  let gr = g.createRadialGradient(0, 0, slabPx * 0.5, 0, 0, slabPx * 1.5);
  gr.addColorStop(0, "rgba(0,0,0,.5)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, slabPx * 1.5, 0, TAU); g.fill(); g.restore();

  if (html !== lastFeed) { $("#feed").innerHTML = html; lastFeed = html; }
  $("#feed-empty").hidden = activities.length > 0;
  document.body.classList.toggle("alarm", alarm);
}
$("#feed").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.dismiss) activities[+b.dataset.dismiss].dismissed = true;
  if (b.dataset.warn) {
    const a = activities[+b.dataset.warn], targets = [...a.sensors].filter((n) => sensors.find((s) => s.n === n)?.online);
    a.warning = { state: "sending", sensors: targets };
    setTimeout(() => { a.warning.state = "sounding"; const t = performance.now(); sensors.forEach((s) => { if (targets.includes(s.n)) s.alarmUntil = t + 5000; }); renderFeed(); }, 1100);
    setTimeout(() => { a.warning.state = "played"; renderFeed(); }, 6100);
  }
  renderFeed();
});

/* ---------- Listening for ---------- */
function renderSounds() {
  $("#sound-list").innerHTML = sounds.map((s, i) => `<li class="sound c-${s.category}${s.enabled ? "" : " off"}" data-id="${s.id}">
    <svg class="ico"><use href="#i-${s.category}"/></svg><span class="name" id="sn-${i}">${s.name}</span>
    ${s.taught ? `<button class="del" data-del="${i}" aria-label="Delete ${s.name}" title="Delete"><svg class="ico"><use href="#i-close"/></svg></button>` : ""}
    <input class="sw" type="checkbox" role="switch" aria-labelledby="sn-${i}" data-i="${i}"${s.enabled ? " checked" : ""}></li>`).join("");
}
let reachShown = false;
function listChanged() { listVersion++; reachShown = true; renderReach(); }
function renderReach() {
  $("#reach").hidden = !reachShown;
  $("#reach").textContent = `Reached ${sensors.filter((s) => s.list === listVersion).length} of ${sensors.length} sensors`;
  if (deviceMode && tab === "devices") renderDrawer();
}
$("#sound-list").addEventListener("change", (e) => { const s = sounds[+e.target.dataset.i]; s.enabled = e.target.checked; e.target.closest("li").classList.toggle("off", !s.enabled); listChanged(); });
$("#sound-list").addEventListener("click", (e) => { const b = e.target.closest("[data-del]"); if (!b) return; sounds.splice(+b.dataset.del, 1); renderSounds(); listChanged(); });

/* ---------- Teach a new sound ---------- */
const teach = $("#teach");
let clips = 0, teaching = false;
function setClips(n) { clips = n; $("#teach-drop").firstChild.textContent = n ? `${n} recordings` : "Drop recordings here"; $("#teach-drop small").textContent = n ? "Drop more to add them" : "or choose files"; }
$("#btn-teach").addEventListener("click", () => { $("#teach-form").reset(); setClips(0); $("#teach-state").textContent = ""; $("#teach-bar").hidden = true; teach.showModal(); });
$("#teach-cancel").addEventListener("click", () => teach.close());
$("#teach-drop").addEventListener("click", () => setClips(clips + 15));
for (const type of ["dragover", "dragleave", "drop"]) $("#teach-drop").addEventListener(type, (e) => {
  e.preventDefault(); e.currentTarget.classList.toggle("over", type === "dragover");
  if (type === "drop") setClips(clips + (e.dataTransfer?.files.length || 15));
});
$("#teach-form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (teaching) return;
  if (!clips) { $("#teach-state").textContent = "Add recordings of the sound first"; return; }
  teaching = true; $("#teach-go").disabled = true; $("#teach-bar").hidden = false;
  let done = 0;
  const step = setInterval(() => {
    done++;
    $("#teach-bar i").style.width = `${Math.min(100, done / (clips + 4) * 100)}%`;
    $("#teach-state").textContent = done <= clips ? `Listening to recording ${done} of ${clips}` : "Training the detector";
    if (done < clips + 4) return;
    clearInterval(step); teaching = false; $("#teach-go").disabled = false; $("#teach-bar i").style.width = "0";
    const name = $("#teach-name").value.trim(), category = new FormData($("#teach-form")).get("cat");
    sounds.push({ id: `taught-${Date.now()}`, name, category, enabled: true, taught: true });
    teach.close(); renderSounds(); listChanged();
    $("#sound-list").lastElementChild.animate([{ background: rgba(COLOR[category], 0.4) }, { background: "transparent" }], { duration: 2600 });
  }, 130);
});

/* ---------- Play sounds ---------- */
function renderPlayer() {
  $("#player").innerHTML = samples.map((s) => `<button class="sample${playing === s ? " playing" : ""}" data-id="${s.id}" aria-pressed="${playing === s}">
    <span class="pp"><svg viewBox="0 0 12 12">${playing === s ? '<rect x="2" y="2" width="8" height="8" rx="1"/>' : '<path d="M3 1.5v9l8-4.5z"/>'}</svg></span>
    <span><b>${s.name}</b><small>${s.credit}</small></span></button>`).join("");
  $("#btn-play").classList.toggle("on", !!playing);
}
function play(sample) { playing = playing === sample ? null : sample; nextHear = performance.now() + 900; renderPlayer(); }
$("#player").addEventListener("click", (e) => { const b = e.target.closest(".sample"); if (b) { touched = true; play(samples.find((s) => s.id === b.dataset.id)); } });
$("#btn-play").addEventListener("click", () => { touched = true; const p = $("#player"); p.hidden = !p.hidden; $("#btn-play").setAttribute("aria-expanded", String(!p.hidden)); });

/* ---------- Devices and the event log ---------- */
let tab = "devices";
function openDrawer(which) {
  tab = which; deviceMode = true; $("#drawer").hidden = false; $("#player").hidden = true;
  $("#btn-devices").setAttribute("aria-expanded", "true"); camera.elT = 1.08; renderDrawer();
}
function closeDrawer() { deviceMode = false; $("#drawer").hidden = true; $("#btn-devices").setAttribute("aria-expanded", "false"); camera.elT = HOME.el; }
function renderDrawer() {
  for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", String(t.dataset.tab === tab));
  if (document.activeElement?.closest("#drawer-body")) return; // never redraw under a field being typed in
  if (tab === "log") return renderLog(true);
  const now = performance.now();
  $("#drawer-body").innerHTML = `<div class="cal row"><p>${calib ? `Calibrating, round ${calib.round} of 3` : calibratedAt ? `Calibrated at ${hhmm(calibratedAt)}` : "Drag a sensor on the map, or let them measure it"}</p>
    <button class="btn" id="btn-cal"${calib ? " disabled" : ""}>Calibrate</button></div>` + sensors.map((s) => {
    const behind = s.list < listVersion, state = !s.online ? "Offline" : behind ? "Updating" : "Online";
    return `<div class="device"><div class="row"><h3>Sensor ${s.n}</h3><span class="state${state === "Online" ? "" : " warn"}">${state}</span></div>
      <dl><dt>Device</dt><dd>${s.id}</dd><dt>Checked in</dt><dd>${Math.max(0, Math.round((now - s.last) / 1000))} s ago</dd>
      <dt>Software</dt><dd>Library ${s.sdk}, ${s.model}, sound list ${s.list}</dd>
      <dt>Trigger</dt><dd>${s.rpm} recordings a minute, noise floor ${s.floor} dB, level ${s.trig.toFixed(1)}</dd>
      <dt>Position</dt><dd>x ${s.tx.toFixed(2)} m, y ${s.ty.toFixed(2)} m</dd></dl>
      <div class="row"><label>Facing <input type="number" min="0" max="359" value="${Math.round(s.facing)}" data-facing="${s.n}"> °</label>
      <button class="link danger" data-remove="${s.n}">Remove</button></div></div>`;
  }).join("") + `<div class="tune"><label for="sens">Sensitivity ${Math.round(sensitivity * 100)}%</label>
    <input id="sens" type="range" min="20" max="90" step="5" value="${Math.round(sensitivity * 100)}"></div>
    <div class="drawer-foot"><button class="link">Sign out</button></div>`;
}
function renderLog(force) {
  if (!deviceMode || tab !== "log") return;
  $("#drawer-body").innerHTML = `<div class="row" style="margin-bottom:16px"><p style="color:var(--soft);font-size:14px">${events.length ? `${events.length} events` : "No events yet"}</p>
    <button class="link danger" id="btn-clear"${events.length ? "" : " disabled"}>Clear events</button></div>` + (events.length ? `<table><thead><tr><th>Time</th><th>Sensor</th><th>Sound</th><th>Confidence</th><th>Angle</th></tr></thead><tbody>
    ${events.slice(0, 80).map((e) => `<tr><td>${hms(wall(e.t))}</td><td>Sensor ${e.n}</td><td>${e.sound}</td><td>${Math.round(e.conf * 100)}%</td><td>${Math.round(e.angle)}°</td></tr>`).join("")}</tbody></table>` : "");
}
$("#btn-devices").addEventListener("click", () => (deviceMode ? closeDrawer() : openDrawer("devices")));
$("#btn-pulse").addEventListener("click", () => openDrawer("log"));
$("#drawer-close").addEventListener("click", closeDrawer);
$(".drawer-head").addEventListener("click", (e) => { const t = e.target.closest(".tab"); if (t) { tab = t.dataset.tab; document.activeElement.blur(); renderDrawer(); } });
$("#drawer-body").addEventListener("input", (e) => {
  if (e.target.dataset.facing) { const s = sensors.find((v) => v.n === +e.target.dataset.facing); s.facing = ((+e.target.value % 360) + 360) % 360; }
  if (e.target.id === "sens") { sensitivity = e.target.value / 100; e.target.previousElementSibling.textContent = `Sensitivity ${e.target.value}%`; }
});
$("#drawer-body").addEventListener("change", (e) => { if (e.target.id === "sens") listChanged(); });
$("#drawer-body").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.remove) { sensors.splice(sensors.findIndex((s) => s.n === +b.dataset.remove), 1); renderFeed(); }
  if (b.id === "btn-clear") { events.length = 0; activities.length = 0; fixes.clear(); bearings.clear(); renderFeed(); }
  if (b.id === "btn-cal") calibrate();
  b.blur(); renderDrawer();
});
function calibrate() {
  const t0 = performance.now(); calib = { round: 1 };
  for (let r = 0; r < 3; r++) {
    setTimeout(() => { calib.round = r + 1; renderDrawer(); }, r * sensors.length * 480);
    sensors.forEach((s, i) => chirps.push({ n: s.n, t: t0 + (r * sensors.length + i) * 480 }));
  }
  setTimeout(() => {
    sensors.forEach((s, i) => { s.tx = s.tx * 1.12 + (i - 1) * 0.04; s.ty = s.ty * 1.12; s.facing = (Math.atan2(-s.tx, -s.ty) * 180 / Math.PI + 360) % 360; });
    calib = null; calibratedAt = new Date(); chirps.length = 0; renderDrawer();
  }, 3 * sensors.length * 480 + 500);
}

/* ---------- Turning the map, and moving a sensor while Devices is open ---------- */
let drag = null;
cv.addEventListener("pointerdown", (e) => {
  touched = true;
  const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  const hit = deviceMode && sensors.find((s) => { const p = P(s.x, s.y); return Math.hypot(p[0] - x, p[1] - y) < 30; });
  drag = { x: e.clientX, y: e.clientY, sensor: hit || null };
  cv.setPointerCapture(e.pointerId); cv.classList.add("moving");
});
cv.addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (drag.sensor) {
    const b = cv.getBoundingClientRect(), [wx, wy] = unproject(e.clientX - b.left, e.clientY - b.top);
    const lim = C.range * 0.85, d = Math.hypot(wx, wy), f = d > lim ? lim / d : 1;
    drag.sensor.tx = drag.sensor.x = Math.round(wx * f * 20) / 20; drag.sensor.ty = drag.sensor.y = Math.round(wy * f * 20) / 20;
    calibratedAt = null;
  } else {
    camera.az = camera.azT = camera.azT - (e.clientX - drag.x) * 0.006;
    camera.el = camera.elT = clamp(camera.elT + (e.clientY - drag.y) * 0.004, 0.32, 1.35);
  }
  drag.x = e.clientX; drag.y = e.clientY;
});
const endDrag = () => { if (drag?.sensor) renderDrawer(); drag = null; cv.classList.remove("moving"); };
cv.addEventListener("pointerup", endDrag); cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("dblclick", () => { camera.azT = HOME.az; camera.elT = deviceMode ? 1.08 : HOME.el; });
addEventListener("keydown", (e) => { if (e.key === "Escape") { if (!$("#player").hidden) $("#btn-play").click(); else if (deviceMode) closeDrawer(); } });

addEventListener("resize", resize);
resize(); renderSounds(); renderPlayer(); renderFeed();
setInterval(() => { renderFeed(); if (deviceMode && tab === "devices") renderDrawer(); }, 1000);
// The prototype opens on a chainsaw so the first look shows the map at work; any touch cancels it.
setTimeout(() => { if (touched) return; play(samples[0]); setTimeout(() => { if (playing === samples[0] && !touched) play(samples[0]); }, 30000); }, 2600);
requestAnimationFrame(frame);
</script>
</body>
</html>
