[project]
name = "forestpulse-sensor"
version = "0.2.0"
description = "Forest Pulse sensor library: audio in, events out"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=1.24", "onnxruntime>=1.17"]

[project.optional-dependencies]
mic = ["sounddevice>=0.4"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["forestpulse_sensor"]

[tool.setuptools.package-data]
forestpulse_sensor = ["data/*.json", "data/*.onnx", "data/reference/*"]
